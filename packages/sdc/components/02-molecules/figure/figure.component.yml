$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Figure
status: stable
description: Component for displaying images with optional captions
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      description: Theme variation (light or dark).
      enum:
        - light
        - dark
    modifier_class:
      type: string
      title: Modifier classes
      description: Additional CSS classes.
    url:
      type: string
      title: URL
      description: Image URL.
    alt:
      type: string
      title: Alt text
      description: Image alt text.
    width:
      type: ['integer', 'null']
      title: Width
      description: Image width.
    height:
      type: ['integer', 'null']
      title: Height
      description: Image height.
    alignment:
      type: string
      title: Alignment
      description: Figure alignment (left, center, right, none). Outputs CKEditor-compatible align-* classes.
      enum:
        - left
        - center
        - right
        - none
slots:
  caption:
    title: Caption
    description: Image caption.
