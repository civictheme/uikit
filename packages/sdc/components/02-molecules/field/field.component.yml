$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Field
status: stable
description: Form field wrapper rendering the label, description, validation message and a control provided via the control slot
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      description: Theme variation (light or dark).
      enum:
        - light
        - dark
    type:
      type: string
      title: Type
      description: Control type, used for presentation only (type class; fieldset wrapper and legend for checkbox and radio; hidden suppresses title, description and message).
    title:
      type: string
      title: Title
      description: Field title.
    title_display:
      type: string
      title: Title display
      description: How to display the field title (visible, invisible, hidden).
      enum:
        - visible
        - invisible
        - hidden
      default: visible
    title_size:
      type: string
      title: Title size
      description: The size of the title (extra-small, small, regular, large, extra-large).
      enum:
        - extra-small
        - small
        - regular
        - large
        - extra-large
      default: regular
    description:
      type: string
      title: Description
      description: Field description. Rendered with id "{id}--description" when the id prop is set, for controls to reference via aria-describedby.
    id:
      type: string
      title: ID
      description: The control DOM ID, used for the title label's "for" attribute and the description id.
    is_invalid:
      type: boolean
      title: Invalid
      description: Whether the field is invalid.
    is_disabled:
      type: boolean
      title: Disabled
      description: Whether the field is disabled.
    is_required:
      type: boolean
      title: Required
      description: Whether the field is required.
    required_text:
      type: string
      title: Required text
      description: Text to display within the label element when required.
    orientation:
      type: string
      title: Orientation
      description: Elements orientation (vertical or horizontal).
      enum:
        - vertical
        - horizontal
      default: vertical
    message:
      type: object
      title: Message
      description: Message object for showing messages.
      properties:
        content:
          type: string
          title: Content
          description: Message content.
    prefix:
      type: string
      title: Prefix
      description: Content to add before the control.
    suffix:
      type: string
      title: Suffix
      description: Content to add after the control.
    modifier_class:
      type: string
      title: Modifier classes
      description: Additional CSS classes.
slots:
  control:
    title: Control
    description: Pre-rendered control markup (form controls built from the atoms, or markup rendered by the consuming platform). Printed inside the "ct-field__control" wrapper; also fillable by overriding the "control_block" block in an embed.
